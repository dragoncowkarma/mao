name: "\U0001F680 Feature Request"
description: Suggest a new feature or improvement for MAO
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you'd like solved
        and any ideas you have for a solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: |
        What problem does this feature solve? Is it related to a frustration with the
        current behavior? Describe the use case.
      placeholder: I'm always frustrated when…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear description of what you'd like to happen.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      description: Which part of MAO does this feature relate to?
      multiple: true
      options:
        - Workflow engine (core)
        - GitHub integration
        - AI providers
        - Electron GUI
        - Headless CLI
        - Build / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, mockups, or screenshots about the feature request.
    validations:
      required: false
